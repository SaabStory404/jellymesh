---
# Transcode pool (transcode/): lint, unit + parity + property tests, static musl build, and the
# shim<->agent protocol suite against the native binaries.
name: transcode

on:
  push:
    branches: [main]
    paths: ['transcode/**', '.github/workflows/transcode.yml']
  pull_request:
    paths: ['transcode/**', '.github/workflows/transcode.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Transcode pool native control plane (transcode): lint, unit + parity
  # tests, static musl build, and the shim<->agent protocol suite run against
  # the native binaries (transcode/spike/proto_test.sh, 21 cases: 1-16, 17a,
  # 17b, 18, 19, 20 (20 itself run in four steps, 20a-20d), 21a-21f shared dir).
  tcpool:
    name: tcpool
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: transcode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          # ring (TLS) needs a musl C compiler for the static build
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add x86_64-unknown-linux-musl
          rustc --version

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transcode/target
          key: tcpool-${{ runner.os }}-${{ hashFiles('transcode/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test (incl. spike parity goldens)
        run: cargo test --locked

      - name: Static build (musl)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Protocol suite on the native binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bin="$PWD/target/x86_64-unknown-linux-musl/release"
          out="$RUNNER_TEMP/proto.out"
          AGENT="$bin/tcpool-agent" SHIM="$bin/tcpool-shim" TC_PROTO_DIR="$RUNNER_TEMP/proto" \
            timeout 720 bash spike/proto_test.sh > "$out" 2>&1 || true
          grep -E "^==|exit=|shim gone|ffmpeg (fenced|gone|STILL)|^batch:|^preempt-|^affinity:|^shared:" "$out"
          # every case must report its expected outcome
          test "$(grep -c '^exit=0' "$out")" -eq 7
          grep -q 'shim gone after [5-8] s' "$out"
          grep -q 'thawed ffmpeg gone' "$out"
          grep -q 'ffmpeg fenced' "$out"
          test "$(grep -c 'worker=transcode -> worker cpu2' "$out")" -eq 3
          # native-only: progress watchdog, pause is not a stall, graceful drain
          grep -q 'stalled: shim exit=247' "$out"
          grep -q 'stalled ffmpeg gone' "$out"
          grep -q 'paused: exit=0' "$out"
          grep -q 'drained: shim exit=247 .* tmp_left=0' "$out"
          # the allowlist: a job reading outside the roots is refused by the agent
          grep -q 'refused: exit=0 agent_refusals=1' "$out"
          # mTLS: with a pool client cert the job runs; without one it is refused
          grep -q 'mtls: with-cert exit=0 ran_on_agent=1; without-cert fell_back=1' "$out"
          # BATCH (trickplay): admitted on the pool with the same frame count as a local run
          grep -q 'batch: on-pool exit=0 frames_match=yes worker=transcode -> worker batchw accepted=1' "$out"
          # output outside TC_TRICKPLAY_OUTPUT_ROOT never reaches any worker
          grep -q 'batch: outside-root exit=0 frames_match=yes pool_attempts=0' "$out"
          # playback preempts a batch job BEFORE its first frame: local rerun, exit 0, full set
          grep -q 'preempt-early: playback_exit=0 frames_at_trigger=0 batch_shim_exit=0 frames_match=yes local_runs=1 agent_preempted=1' "$out"
          # playback preempts a batch job AFTER its first frame: shim exits non-zero (200), no
          # local rerun, the partial set stays exactly as the pool left it
          grep -q 'preempt-late: playback_exit=0 batch_shim_exit=200 partial=yes stable=yes local_runs=0 agent_preempted=1 no_rerun_logged=1' "$out"
          # a batch worker is lost outright (agent + ffmpeg killed, not a preemption) AFTER its
          # first frame: same no-local-rerun contract as preempt-late, via Attempt::Lost
          grep -q 'batch: lost-after-frame exit=200 partial=yes stable=yes local_runs=0 no_rerun_logged=1' "$out"
          # TC_ACCEPT_BATCH=0 and a headroom-full worker both fall back to a local run
          grep -q 'batch: accept-off exit=0 frames_match=yes reason=1' "$out"
          grep -q 'batch: headroom-full exit=0 frames_match=yes reason=1' "$out"
          # TC_BATCH unset (default): trickplay never contacts the pool
          grep -q 'batch: gate-off exit=0 frames_match=yes pool_attempts=0' "$out"
          # Seek affinity: the initial start pins worker "affa" (both idle, listed first)
          grep -q 'affinity: start exit=0 worker=affa pinned=affa' "$out"
          # a seek (-start_number, same output prefix) stays on the pin even though the other
          # worker is now the freer one by rank()'s own metric
          grep -q 'affinity: seek exit=0 worker=affa pinned=affa same_worker=yes' "$out"
          grep -q 'affinity hit: pinning worker affa to the front' "$out"
          # killing the pinned worker mid-stream: 255 exit, pin cleared before it, not after
          grep -q 'affinity: kill exit=255 pinned=absent' "$out"
          grep -q 'affinity cleared: worker affa lost' "$out"
          # the restart after the kill lands on the survivor and re-pins to it
          grep -q 'affinity: restart exit=0 worker=affb pinned=affb' "$out"
          # a stall (agent watchdog kills ffmpeg; agent itself stays healthy) also clears the pin
          # -- regression for the gap where only the dropped-connection (Lost) path cleared it
          grep -q 'affinity: stall exit=247 pinned=absent' "$out"
          # the code in this log line is the agent's raw signal-derived value (-9), not the
          # masked 247 the shim process actually exits with (see the `stall exit=247` line above)
          grep -q 'affinity cleared: worker affb exited -9 after the first segment' "$out"
          # Shared transcode dir (docs/SHARED-TRANSCODE.md): the shim dies, the same ffmpeg keeps
          # writing and the agent keeps the lease fresh; a seek from another replica takes the
          # output over (orphaned or attached holder); a stale keepalive ends and cleans up
          grep -q 'shared: detached same_ffmpeg=yes growing=yes lease_fresh=yes' "$out"
          grep -q 'shared: takeover exit=0 old_ffmpeg=gone seek_segment=yes took_over_logged=1' "$out"
          grep -q 'shared: attached-takeover old_exit=0 new_exit=0 seek_segment=yes' "$out"
          grep -q 'shared: orphan-expired ffmpeg_gone=yes .* files_left=0 keepalive=removed' "$out"
          # a throttler-paused (p) job whose shim dies gets u from the agent
          grep -q 'shared: paused-detach keys_pu=1' "$out"
          # a detached job throttles itself against the viewer's position sidecar: pauses when
          # too far ahead (the lead then stays put), resumes when the viewer catches up, pauses
          # again, runs unthrottled once the position goes stale, and the sidecar is cleaned up
          grep -q 'shared: throttle keys=pupu bounded=yes repaused=yes stale_resume_after=[0-9]*s runs_after=yes sidecar=removed .*stale_logged=1' "$out"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tcpool-musl
          path: |
            transcode/target/x86_64-unknown-linux-musl/release/tcpool-agent
            transcode/target/x86_64-unknown-linux-musl/release/tcpool-shim
            transcode/target/x86_64-unknown-linux-musl/release/tcpool-sync
