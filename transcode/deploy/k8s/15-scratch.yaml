# The shared transcode scratch: the one directory every agent writes segments into and every
# Jellyfin replica reads them back out of (PLAN §1, "shared scratch"). See CONTRACT.md
# "Required mounts" and "Two rules about the scratch directory".
#
# `storageClassName: ""` on BOTH objects is required, not cosmetic: this cluster has two
# StorageClasses both marked default, so an unqualified RWX claim binds non-deterministically.
# The PV is static and pre-bound by `volumeName`, which removes the binding race entirely.
#
# `mountOptions` are load-bearing (CONTRACT, MEASURED): with NFS defaults a freshly written segment
# stayed invisible to the other node for 12-23 s, which is Jellyfin waiting on a segment that
# already exists on disk.
#
# The 200Gi below is the claim size, not an enforced quota - the quota lives on the NFS export
# (PLAN §1: "NFS, 200 GiB quota"). The NFS server `192.0.2.120` is the repo's anonymized address,
# same substitution as everywhere else in this tree.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: transcode-scratch-media
  labels:
    app.kubernetes.io/part-of: tcpool
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=4.2
    - lookupcache=positive
    - actimeo=1
  nfs:
    server: 192.0.2.120
    path: /mnt/pool/transcode-scratch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transcode-scratch
  namespace: media
  labels:
    app.kubernetes.io/part-of: tcpool
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: transcode-scratch-media
  resources:
    requests:
      storage: 200Gi