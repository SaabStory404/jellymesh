[workspace]
resolver = "2"
members = ["crates/ir", "crates/proto", "crates/agent", "crates/shim", "crates/sync"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "rt", "macros", "process", "io-util", "io-std", "net", "time", "sync", "signal", "fs"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-health = "0.14.6"
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
futures = "0.3.34"
tcpool-ir = { path = "crates/ir" }
tcpool-proto = { path = "crates/proto" }

[profile.release]
lto = "thin"
codegen-units = 1
# unwind (not abort): the shim catches panics and falls back safely
strip = true
